---

{{ if .Vars.deb13cis_level_1 }}
  {{ if .Vars.deb13cis_rule_1_5_12 }}
command:
  system_processsizemax_conf:
    title: 1.5.12 | Ensure systemd-coredump ProcessSizeMax is configured
    exec: grep -Rhs '^ProcessSizeMax' /etc/systemd/coredump.conf /etc/systemd/coredump.conf.d/
    exit-status: 0
    stdout:
    - '/^ProcessSizeMax\s*=\s*0\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.5.12
      NIST800-53R5: CM-6
      CCI: CCI-000366
  {{ end }}
{{ end }}
